project_name: "Real-Time Fraud Detection Platform"
version: "1.0.0"

data:
  raw_path: "data/raw/creditcard.csv"
  processed_train_path: "data/processed/train.parquet"
  processed_test_path: "data/processed/test.parquet"
  test_size: 0.2
  random_state: 42

model:
  target_column: "Class"
  experiment_name: "fraud_detection_v1"
  xgb_params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 10